          - "<grad:#FFD700:#FF8C00>Aris — самый мощный донат</grad>"
      - name: "<grad:#FFD700:#FF8C00>Кирка Ариса</grad>"
        material: NETHERITE_PICKAXE
        amount: 1
        enchantments:
          - "efficiency:6"
          - "fortune:5"
          - "unbreaking:5"
          - "mending:1"
      - name: "<grad:#FFD700:#FF8C00>Шлем Ариса</grad>"
        material: NETHERITE_HELMET
