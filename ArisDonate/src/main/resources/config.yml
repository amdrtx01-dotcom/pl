texts:
  motd:
    - "<grad:#FFD700:#FF8C00>══════════ Добро пожаловать! ══════════</grad>"
    - "&7Сервер &eAris &7— Minecraft 1.21.x"
    - "&7Команды: &e/help-aris &7для полного списка."
    - "&7Купить донат: &6/donate"
  rules:
    - "<grad:#FF5555:#FFAA00>══ Правила сервера ══</grad>"
    - "&71. Не читерим, не флудим, не оскорбляем."
